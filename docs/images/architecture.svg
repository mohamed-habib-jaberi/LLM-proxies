<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Un client, un proxy LiteLLM, plusieurs API fournisseurs</title>
<desc id="desc">Le client communique avec LiteLLM sur la même machine par HTTP et clé maître. Selon l'alias demandé et la configuration YAML, LiteLLM appelle OpenAI, Groq ou Cohere via HTTPS avec la clé de chaque fournisseur. Chaque réponse revient via LiteLLM au client.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="1100" height="620" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle">
<text x="550" y="35" font-size="23">Un même client peut appeler plusieurs fournisseurs via LiteLLM</text>
<rect x="20" y="70" width="630" height="485" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
<text x="335" y="105" font-size="19">Même machine : Mac ou runtime Colab</text>
<rect x="45" y="220" width="210" height="115" rx="10" fill="#fff" stroke="#334155"/>
<text x="150" y="250" font-size="20">Notebook Python</text>
<text x="150" y="278" font-size="16">Client compatible OpenAI</text>
<text x="150" y="305" font-size="16">Choisit un alias de modèle</text>
<rect x="420" y="220" width="205" height="115" rx="10" fill="#fff" stroke="#334155"/>
<text x="522" y="250" font-size="20">Proxy LiteLLM</text>
<text x="522" y="278" font-size="16">127.0.0.1:4000/v1</text>
<text x="522" y="305" font-size="16">Route vers le fournisseur</text>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M255 245 H410"/><path d="M420 315 H265"/>
<path d="M625 240 H675 V165 H830"/>
<path d="M625 275 H830"/>
<path d="M625 310 H690 V385 H830"/>
<path d="M522 435 V345"/>
</g>
<text x="337" y="186" font-size="16">Question + alias · HTTP</text>
<text x="337" y="208" font-size="15">Clé maître LiteLLM</text>
<text x="337" y="365" font-size="16">Réponse JSON</text>
<rect x="840" y="115" width="235" height="90" rx="10" fill="#f0fdf4" stroke="#334155"/>
<text x="957" y="147" font-size="20">API OpenAI</text>
<text x="957" y="177" font-size="16">Modèle OpenAI</text>
<rect x="840" y="230" width="235" height="90" rx="10" fill="#f0fdf4" stroke="#334155"/>
<text x="957" y="262" font-size="20">API Groq</text>
<text x="957" y="292" font-size="16">Modèle accessible via Groq</text>
<rect x="840" y="345" width="235" height="90" rx="10" fill="#f0fdf4" stroke="#334155"/>
<text x="957" y="377" font-size="20">API Cohere</text>
<text x="957" y="407" font-size="16">Modèle Cohere</text>
<text x="735" y="131" font-size="15">HTTPS</text>
<text x="735" y="152" font-size="14">OPENAI_API_KEY</text>
<text x="735" y="241" font-size="15">HTTPS</text>
<text x="735" y="263" font-size="14">GROQ_API_KEY</text>
<text x="755" y="350" font-size="15">HTTPS</text>
<text x="755" y="372" font-size="14">COHERE_API_KEY</text>
<rect x="400" y="445" width="225" height="80" rx="8" fill="#fff" stroke="#334155"/>
<text x="512" y="473" font-size="19">config/*.yaml</text>
<text x="512" y="498" font-size="15">Alias → fournisseur / modèle</text>
<text x="192" y="455" font-size="16">Même URL et même clé client.</text>
<text x="192" y="483" font-size="16">Changer model pour choisir l'API.</text>
<text x="857" y="480" font-size="16">La réponse de chaque API revient</text>
<text x="857" y="506" font-size="16">au client en passant par LiteLLM.</text>
<text x="550" y="592" font-size="17">Alias distincts : choix explicite · Alias partagé : répartition · Fallback : secours après échec</text>
</g>
</svg>
